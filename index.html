<!DOCTYPE html>
<html>
<head>
    <title>SmartShield</title>
    <style>
        body {
            font-family: Arial;
            background: #0b1b3b;
            color: white;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
            margin-top: 50px;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }

        button {
            background: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ SmartShield</h1>
    <h3>AI Scam Detection System</h3>

    <textarea id="text" placeholder="Enter message..."></textarea>

    <input type="text" id="url" placeholder="Enter URL here...">
    <input type="text" id="email" placeholder="Enter email content here...">

    <button onclick="checkScam()">Check Scam</button>

    <div id="result"></div>
</div>

<script>
function detectScam(text) {
    let scamKeywords = [
        "win", "prize", "free", "money",
        "urgent", "click", "offer",
        "lottery", "claim"
    ];

    let score = 0;

    let lowerText = text.toLowerCase();

    scamKeywords.forEach(word => {
        if (lowerText.includes(word)) {
            score += 10;
        }
    });

    if (lowerText.includes("http")) {
        score += 20;
    }

    if (score >= 50) {
        return {
            result: "Scam",
            percent: score,
            reason: "Suspicious keywords or links detected"
        };
    } else {
        return {
            result: "Safe",
            percent: score,
            reason: "No major threats detected"
        };
    }
}

function checkScam() {
    let text = document.getElementById("text").value;
    let url = document.getElementById("url").value;
    let email = document.getElementById("email").value;

    let combined = text + " " + url + " " + email;

    let output = detectScam(combined);

    let color = output.result === "Scam" ? "red" : "green";

    document.getElementById("result").innerHTML = `
        <h2 style="color:${color}">
            ${output.result} (${output.percent}%)
        </h2>
        <p><b>Reason:</b> ${output.reason}</p>
    `;
}

// 🔥 Press ENTER to trigger check
document.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkScam();
    }
});
</script>

</body>
</html>
